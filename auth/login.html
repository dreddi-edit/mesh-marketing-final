<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Sign in to Mesh</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg:#020406; --panel:#060c12; --ink:#fff; --muted:rgba(255,255,255,0.42);
    --line:rgba(255,255,255,0.08); --line-strong:rgba(0,212,232,0.32);
    --cyan:#00d4e8; --cyan-soft:rgba(0,212,232,0.12);
    --amber:#f59e0b; --red:#ef4444; --green:#22c55e;
    color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(circle at 10% 10%, rgba(0,212,232,0.06) 0%, transparent 40%),radial-gradient(circle at 90% 80%, rgba(0,212,232,0.04) 0%, transparent 40%),var(--bg);
    color:var(--ink); font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    display:grid; place-items:center; min-height:100vh; padding:24px;
  }
  .card{width:100%; max-width:480px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,0.55)}
  .brand{font-family:'Geist Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.3em; color:var(--cyan); text-transform:uppercase; margin-bottom:6px}
  h1{font-family:'Barlow Condensed','Impact',sans-serif; font-style:italic; font-weight:900; font-size:52px; line-height:0.95; letter-spacing:-0.02em; margin:0 0 12px; text-transform:uppercase}
  .sub{color:var(--muted); font-size:14px; line-height:1.55; margin-bottom:24px}
  label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px}
  input{width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px 14px; font-size:14px; font-family:inherit; outline:none}
  input:focus{border-color:var(--cyan)}
  .btn-row{display:grid; gap:10px; margin-top:18px}
  button{width:100%; background:var(--ink); color:var(--bg); border:none; border-radius:10px; padding:14px 16px; font-weight:700; font-size:14px; cursor:pointer}
  button:hover{box-shadow:0 8px 24px rgba(0,212,232,0.18)}
  button:disabled{opacity:0.5; cursor:not-allowed}
  button.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; gap:10px}
  button.ghost:hover{border-color:var(--cyan); color:var(--cyan)}
  .or{display:flex; align-items:center; gap:12px; margin:22px 0 16px; color:var(--muted); font-size:11px; letter-spacing:0.2em; text-transform:uppercase}
  .or::before,.or::after{content:""; flex:1; height:1px; background:var(--line)}
  .err,.info,.ok{margin-top:16px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.5; border:1px solid}
  .err{background:rgba(239,68,68,0.08); color:var(--red); border-color:rgba(239,68,68,0.32)}
  .info{background:rgba(245,158,11,0.06); color:var(--amber); border-color:rgba(245,158,11,0.28)}
  .ok{background:rgba(34,197,94,0.06); color:var(--green); border-color:rgba(34,197,94,0.28)}
  .footer{margin-top:24px; border-top:1px solid var(--line); padding-top:16px; font-size:12px; color:var(--muted); text-align:center}
  .footer a{color:var(--cyan); text-decoration:none}
  svg.icon{width:18px; height:18px; flex-shrink:0}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Mesh · Sign in</div>
    <h1>Welcome Back</h1>
    <p class="sub">Sign in to your Mesh account.</p>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />

    <div class="btn-row">
      <button id="signin-btn" type="button">Sign in</button>
    </div>

    <div class="or">or</div>

    <div class="btn-row">
      <button id="google-btn" type="button" class="ghost">
        <svg class="icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <button id="github-btn" type="button" class="ghost">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57v-2c-3.34.72-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.08-.74.08-.73.08-.73 1.2.09 1.83 1.24 1.83 1.24 1.08 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18a4.65 4.65 0 0 1 1.24 3.22c0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3z"/></svg>
        Continue with GitHub
      </button>
    </div>

    <div id="msg-err" class="err" style="display:none"></div>
    <div id="msg-info" class="info" style="display:none"></div>
    <div id="msg-ok" class="ok" style="display:none"></div>

    <div class="footer">
      <a href="#" id="forgot-link">Forgot your password?</a>
      <span style="opacity:0.5; margin: 0 8px">·</span>
      No account yet? <a href="/auth/signup">Create one</a>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://msmonxiacxhendxehezw.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zbW9ueGlhY3hoZW5keGVoZXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NDU3NTMsImV4cCI6MjA5MjUyMTc1M30.K-FQFpcOwtJAIAfn5lTzmrox_6cv_8qqXGxi9IgosB8';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON);

const $ = (id) => document.getElementById(id);
function showErr(m){ $('msg-err').textContent=m; $('msg-err').style.display='block'; $('msg-info').style.display='none'; $('msg-ok').style.display='none'; }
function showInfo(m){ $('msg-info').textContent=m; $('msg-info').style.display='block'; $('msg-err').style.display='none'; $('msg-ok').style.display='none'; }
function showOk(m){ $('msg-ok').textContent=m; $('msg-ok').style.display='block'; $('msg-err').style.display='none'; $('msg-info').style.display='none'; }

const cliSession = new URLSearchParams(location.search).get('session_id');
// CLI-originated login completes the handshake back at /auth/cli; a
// plain web sign-in lands in the account dashboard. /auth/welcome
// stays available for the brand-new-signup "fill in your name" gate.
const baseRedirect = cliSession
  ? `${location.origin}/auth/cli?session_id=${encodeURIComponent(cliSession)}`
  : `${location.origin}/account`;

$('signin-btn').addEventListener('click', async () => {
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(!email || !password){ showErr('Email and password are required.'); return; }
  const btn=$('signin-btn'); btn.disabled=true; btn.textContent='Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error || !data?.session) throw new Error(error?.message || 'Login failed.');
    location.href = baseRedirect;
  } catch (e) {
    showErr(e.message || String(e));
    btn.disabled=false; btn.textContent='Sign in';
  }
});

async function startOAuth(provider) {
  try {
    const { error } = await sb.auth.signInWithOAuth({ provider, options:{ redirectTo: baseRedirect } });
    if (error) throw new Error(error.message);
  } catch (e) { showErr(e.message || String(e)); }
}
$('google-btn').addEventListener('click', () => startOAuth('google'));
$('github-btn').addEventListener('click', () => startOAuth('github'));

// Forgot-password flow. Supabase sends a magic reset link that lands at
// /auth/welcome (or a dedicated /auth/reset page once we ship one). The
// user types their email in the same field that's already on the page —
// no second screen needed.
$('forgot-link').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim().toLowerCase();
  if (!email) {
    showErr('Enter your email above, then click "Forgot your password?".');
    $('email').focus();
    return;
  }
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: `${location.origin}/auth/welcome?reset=1`,
    });
    if (error) throw new Error(error.message);
    showOk('Check your inbox — we sent a reset link to ' + email + '.');
  } catch (err) {
    showErr(err.message || String(err));
  }
});
</script>
</body>
</html>
